<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://maliceandmortar.com/">
<title>Malice &amp; Mortar has moved</title>
<style>html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15101c;color:#efe6d2;font:1.1rem/1.5 Georgia,serif;text-align:center;padding:16px;box-sizing:border-box}a{color:#f2a53b}</style>
</head>
<body>
<main>
<h1>Malice &amp; Mortar has moved</h1>
<p id="msg">Packing up your lair and taking it to the new address&hellip;</p>
<p><a id="go" href="https://maliceandmortar.com/">Go to the new address</a></p>
</main>
<script>
(function(){
  var NEW="https://maliceandmortar.com/",KEY="malice-mortar-v1",dest=NEW;
  if(location.href.indexOf(NEW)===0){document.getElementById("msg").textContent="The new address is not set yet. Put it in site.config.json and build again.";return;}
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var code=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");dest=NEW+"#import="+code;}
  }catch(e){}
  document.getElementById("go").href=dest;
  var done=function(){location.replace(dest);};
  var jobs=[];
  try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));}catch(e){}
  try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("mm-")===0;}).map(function(k){return caches.delete(k);}));}));}catch(e){}
  Promise.all(jobs).then(done,done);setTimeout(done,2500);
})();
</script>
</body>
</html>
